<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Restaurant Locator - by Algolia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./assets/favicon.ico" type="image/png" />
    <link rel="stylesheet" href="index.css" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet.markercluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="app">
      <!-- Header -->
      <header class="app-header">
        <div class="header-content">
          <div class="brand">
            <span class="brand-icon">🍽️</span>
            <span class="brand-title">Restaurant Locator</span>
          </div>
          <div class="search-wrapper">
            <div id="search-input"></div>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="app-main">
        <!-- Filters Sidebar -->
        <aside class="filters-panel" id="filters-panel">
          <div class="filters-header">
            <h3>Filters</h3>
            <button class="filters-close" id="filters-close">✕</button>
          </div>
          <div class="filters-body">
            <div class="filter-group">
              <h4>Cuisine</h4>
              <div id="cuisine-facets"></div>
            </div>
            <div class="filter-group">
              <h4>Price</h4>
              <div id="price-facets"></div>
            </div>
            <div class="filter-group">
              <h4>Dining Style</h4>
              <div id="dining-style-facets"></div>
            </div>
            <button class="btn-clear-filters" id="clear-filters">Clear all filters</button>
          </div>
        </aside>

        <!-- Results -->
        <section class="results-panel">
          <!-- Stats Bar -->
          <div class="stats-bar">
            <div class="stats-left">
              <span class="stats-count" id="results-count"></span>
              <span class="stats-time" id="results-time"></span>
            </div>
            <div class="stats-right">
              <button class="btn-filters-toggle" id="filters-toggle" aria-label="Toggle filters">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M2.5 5H17.5M5 10H15M7.5 15H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </button>
              <select id="sort-select" class="sort-select">
                <option value="relevance">Relevance</option>
                <option value="rating">Highest Rated</option>
                <option value="reviews">Most Reviewed</option>
                <option value="price_asc">Price: Low → High</option>
                <option value="price_desc">Price: High → Low</option>
              </select>
            </div>
          </div>

          <!-- Results Grid -->
          <div class="results-grid" id="hits">
            <!-- Results inserted here -->
          </div>

          <!-- Load More -->
          <div class="load-more" id="show-more">
            <button class="btn-load-more" id="show-more-btn">
              Show more restaurants
              <span class="arrow-down">↓</span>
            </button>
          </div>

          <!-- Map -->
          <div class="map-section">
            <div class="map-header">
              <h3 class="map-title">📍 Restaurant Locations</h3>
              <span class="map-hint">Scroll to zoom · Drag to explore</span>
            </div>
            <div id="map"></div>
          </div>
        </section>
      </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4/dist/algoliasearch-lite.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4/dist/instantsearch.production.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
