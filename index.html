<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Restaurant Locator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes" />
    <link rel="icon" href="./assets/favicon.ico" type="image/png" />
    <link rel="stylesheet" href="index.css" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet.markercluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="app" id="app">
      <!-- HEADER -->
      <header class="app-header">
        <div class="header-content">
          <div class="brand">
            <span class="brand-icon">🍽️</span>
            <span class="brand-title">Restaurant Locator</span>
          </div>
          <span class="brand-subtitle">Find your next favorite spot</span>
          <div class="search-wrapper">
            <div id="search-input"></div>
          </div>
        </div>
      </header>

      <!-- FILTERS BAR -->
      <div class="filters-bar">
        <button class="btn-filters-toggle" id="filters-toggle">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M2.5 5H17.5M5 10H15M7.5 15H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Filters
        </button>
        <button class="btn-clear-filters" id="clear-filters" style="width:auto;padding:4px 12px;background:none;border:none;font-size:12px;color:#8e9aaf;cursor:pointer;">Clear all</button>
      </div>

      <!-- FILTERS PANEL -->
      <div class="filters-panel" id="filters-panel">
        <div class="filter-group">
          <h4>Cuisine</h4>
          <div id="cuisine-facets"></div>
        </div>
        <div class="filter-group">
          <h4>Price</h4>
          <div id="price-facets"></div>
        </div>
        <div class="filter-group">
          <h4>Dining Style</h4>
          <div id="dining-style-facets"></div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats-bar">
        <div class="stats-left">
          <span class="stats-count" id="results-count"></span>
        </div>
        <div class="stats-right">
          <select id="sort-select" class="sort-select">
            <option value="relevance">Relevance</option>
            <option value="rating">Highest Rated</option>
            <option value="reviews">Most Reviewed</option>
            <option value="price_asc">Price: Low → High</option>
            <option value="price_desc">Price: High → Low</option>
          </select>
        </div>
      </div>

      <!-- RESULTS - SOLO 6 RESULTADOS -->
      <div class="results-scroll" id="results-scroll">
        <div class="results-grid" id="hits">
          <!-- Results inserted here by InstantSearch (6 max) -->
        </div>

        <!-- LOAD MORE -->
        <div class="load-more" id="show-more">
          <button class="btn-load-more" id="show-more-btn">
            Show more restaurants
            <span class="arrow-down">↓</span>
          </button>
        </div>

        <!-- MAP -->
        <div class="map-section">
          <div class="map-header">
            <span class="map-title">📍 Locations</span>
            <span class="map-hint">Tap a card to zoom</span>
          </div>
          <div id="map"></div>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4/dist/algoliasearch-lite.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4/dist/instantsearch.production.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
